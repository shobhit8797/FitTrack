name: FitTrack
options:
  bundleIdPrefix: com.fittrack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  FitTrack:
    type: application
    platform: iOS
    sources:
      - path: FitTrack
        excludes:
          - "Resources/Info.plist"   # usage strings are injected below, not compiled
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fittrack.FitTrack
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        DEVELOPMENT_TEAM: 7MFYAGK3VV
    entitlements:
      path: FitTrack/FitTrack.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: FitTrack/Info.plist
      properties:
        # Usage strings (spec §12/§13) — copied from Resources/Info.plist.
        NSHealthShareUsageDescription: "FitTrack reads your steps, active energy, exercise minutes, and body mass to show daily activity and weight trends. This data stays on your device."
        NSHealthUpdateUsageDescription: "FitTrack can optionally save your logged weight and dietary energy back to Apple Health."
        NSCameraUsageDescription: "FitTrack uses the camera to scan barcodes and photograph meals and nutrition labels for logging."
        NSPhotoLibraryUsageDescription: "FitTrack lets you pick a meal photo from your library to estimate its nutrition."
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.656562200709-e7d4ppc0qlgef532589mj0opg3219iub
